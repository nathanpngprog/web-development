<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Information</title>
    </head>
    <body>
        <fieldset>
        <form action="saveinfo.html" method="get" target="_blank">
  <fieldset>
    <legend>Personal Information</legend>
    <label>First name:</label>
    <input type="text" name="firstname" placeholder="Enter First Name" required>
    <label>Last name:</label>
    <input type="text" name="lastname" placeholder="Enter Last Name" required>
    <label>Middle name:</label>
    <input type="text" name="middlename" placeholder="Enter Middle Name" required><br><br>
    
    <label>Email Address:</label>
    <input type="email" name="email" placeholder="Enter Email Address" required>
    <label>Password:</label>
    <input type="password" name="password" maxlength="12" minlength="4" placeholder="Enter Password" required><br><br>
    
    <label>Age:</label>
    <input type="number" name="age" placeholder="Enter Age" required>
    <label>Birth Date:</label>
    <input type="date" name="birthdate" required><br><br>
    
    <label>Contact Number:</label>
    <input type="tel" name="contact" placeholder="09XXXXXXXXX" required>
    <label>Document:</label>
    <input type="file" name="document"><br><br>
  </fieldset>

  <fieldset>
    <legend>Student Information</legend>
    <label>Student ID:</label>
    <input type="text" name="studentid" placeholder="ex. 2627M00691" required><br><br>
    
    <label>Grade Level</label>
    <select name="gradelevel" required>
      <option value="">Select Grade Level</option>
      <option value="Grade 7">Grade 7</option>
      <option value="Grade 8">Grade 8</option>
      <option value="Grade 9">Grade 9</option>
      <option value="Grade 10">Grade 10</option>
      <option value="Grade 11">Grade 11</option>
      <option value="Grade 12">Grade 12</option>
    </select>
    
    <label>Strand</label>
    <select name="strand" required>
      <option value="">Select Strand</option>
      <option value="STEM">STEM</option>
      <option value="ABM">ABM</option>
      <option value="HUMSS">HUMSS</option>
      <option value="ICT">ICT</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>Additional information</legend>
    <label>Gender</label><br>
    <input type="radio" name="gender" value="Male"> Male 
    <input type="radio" name="gender" value="Female"> Female 
    <input type="radio" name="gender" value="Other"> Other<br><br>
    
    <label>Hobbies</label><br>
    <input type="checkbox" name="hobbies" value="Reading"> Reading 
    <input type="checkbox" name="hobbies" value="Writing"> Writing 
    <input type="checkbox" name="hobbies" value="Sports"> Sports 
    <input type="checkbox" name="hobbies" value="Music"> Music 
    <input type="checkbox" name="hobbies" value="Coding"> Coding<br>
    <input type="checkbox" name="hobbies" value="Gaming"> Gaming 
    <input type="checkbox" name="hobbies" value="PlayingGames"> Playing Games<br><br>
    
    <label>Complete Address</label><br>
    <textarea style="width: 1000px; height:auto;" name="address" placeholder="Enter Complete Address" required></textarea><br><br>
    
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </fieldset>
</form>
        
    </body>
</html>
