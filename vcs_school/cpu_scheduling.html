<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling</title>
    <style>
        table, tr, th, td {
            border: 1px solid black;
            padding: 5px;
        }
        th {
            background-color: lightslategray;
        }
        td {
            text-align: center;
        }
        .time-row td {
            text-align: left;
            border: none;
        }
    </style>
</head>
<body>
<table>
    <tr>
              <th>Process</th>
              <th>Arrival Time</th>
              <th>Burst Time</th>
              <th>Turnaround Time</th>
              <th>Completion Time</th>
              <th>Waiting Time</th>
            </tr>
            <tr>
                <td>P1</td>
                <td>4</td>
                <td>2</td>
                <td>5</td>
                <td>6</td>
                <td>1</td>
            </tr>
            <tr>
                <td>P2</td>
                <td>2</td>
                <td>3</td>
                <td>5</td>
                <td>3</td>
                <td>0</td>
            </tr>
                <td>P3</td>
                <td>5</td>
                <td>2</td>
                <td>12</td>
                <td>7</td>
                <td>5</td>
            </tr>
            <tr>
                <td>P4</td>
                <td>15</td>
                <td>4</td>
                <td>19</td>
                <td>4</td>
                <td>0</td>
            </tr>
      </table>
      <table>
        <tr>
            <td class="idle">Idle</td>
            <td class="p2">P2</td>
            <td class="p1">P1</td>
            <td class="p3">P3</td>
            <td class="idle">Idle</td>
            <td class="p4">P4</td>
        </tr>
        <tr class="time-row">
            <td>0</td>
            <td>2</td>
            <td>5</td>
            <td>10</td>
            <td>12</td>
            <td>15</td>
            <td>19</td>
        </tr>
    </table>
</body>
</html>
